# Builds a signed arm64 release APK on a runner, from a clean checkout.
#
#   Actions → Android release → Run workflow (branch: whatever carries the change)
#
# Nothing is built locally: the APK here is the one that goes on a phone. Two
# things this job has to produce for itself, because neither is in the repository:
#   - the bundled Linux runtime (runtime/out/arm64-v8a), built by
#     runtime/build-runtime.sh from pinned, hashed downloads;
#   - the Gradle wrapper (app/android/.gitignore keeps gradlew and the wrapper
#     jar out), generated here from the pinned Gradle version.
#
# Signing comes from Actions secrets; a checkout without them builds a release
# APK signed with the debug key, which is why the job refuses to upload one:
#   KEYSTORE_BASE64   the keystore file, base64
#   STORE_PASSWORD    keystore password
#   KEY_ALIAS         key alias inside it
#   KEY_PASSWORD      that key's password
name: Android release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name (X.Y.Z); empty = app/pubspec.yaml'
        required: false
      build_number:
        description: 'versionCode (2..2100000000); empty = current build minute'
        required: false
      companion:
        description: 'Build with the companion pack (~/keys secret, not configured yet)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: Signed arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # gradlew is not tracked, so Gradle comes from here.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # Without this the action only writes its cache on the default branch, so a
          # build on a feature branch starts from an empty cache every time and resolves
          # all ~300 artifacts again -- one slow mirror or one 429 then fails the run.
          cache-read-only: false

      # The runtime's downloads are hashed on every run, so a stale cache is harmless.
      - name: Restore the runtime download cache
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      # app/android/settings.gradle.kts reads flutter.sdk from local.properties while it
      # resolves plugins, so this must exist before ANY Gradle invocation below, the
      # wrapper one included.
      - name: Local properties
        working-directory: app
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Gradle wrapper
        working-directory: app/android
        run: |
          set -euo pipefail
          # Every resolution still reaches a Maven host on a cold cache, and a shared
          # runner IP does get 429/502 from time to time. Three attempts with a pause
          # costs a minute on failure and needs no mirror that fights the toolchain.
          for attempt in 1 2 3; do
            if gradle wrapper --gradle-version "$GRADLE_VERSION"; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "gradle wrapper failed (attempt $attempt), retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Install the pinned NDK (libtawcroot.so)
        run: |
          set -euo pipefail
          ndk=$(python3 -c 'import json,sys; print(json.load(open("runtime/tawcroot/source.json"))["ndkVersion"])')
          echo "runner ANDROID_NDK_HOME before: ${ANDROID_NDK_HOME:-<unset>}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
          cat "$ANDROID_HOME/ndk/$ndk/source.properties" | grep Pkg.Revision || true
          # runtime/tawcroot/build.py takes ANDROID_NDK_HOME over the SDK's ndk/, and the
          # runner image's own value can point at a different revision: pin it to the one
          # the build just installed, and say which it was.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Build the bundled runtime (arm64)
        run: runtime/build-runtime.sh arm64-v8a

      - name: Save the runtime download cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error::missing Actions secrets: ${missing[*]}. A release build must be signed with the release key."
            exit 1
          fi
          keydir="$RUNNER_TEMP/keys"
          mkdir -p "$keydir"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keydir/release.jks"
          chmod 600 "$keydir/release.jks"
          # Prove the key is usable here, not 20 minutes later inside Gradle: a wrong
          # password, a truncated base64 paste or the wrong alias all pass the checks
          # above and only fail the APK step. The store type is read from the bytes,
          # because keytool's modern default is PKCS#12 whatever the file is called.
          store_type=$(python3 -c "import sys; h = open(sys.argv[1], 'rb').read(8); print('pkcs12' if len(h) >= 8 and h[0] == 0x30 and h[1] == 0x82 and h[4] == 2 and h[5] == 1 and h[6] == 3 else 'jks')" "$keydir/release.jks")
          echo "keystore type: $store_type"
          keytool -list -v -keystore "$keydir/release.jks" -storetype "$store_type" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | tee "$RUNNER_TEMP/key-info.txt" > /dev/null
          # The certificate fingerprint is what an update is checked against, and it is
          # public (it ships inside every APK). Print it so a release can be compared with
          # the offline backup: the same fingerprint means this key can update builds made
          # with that backup.
          echo "### Signing certificate"
          grep -i 'SHA256:' "$RUNNER_TEMP/key-info.txt" || {
            echo "::error::keytool printed no SHA256 fingerprint for alias $KEY_ALIAS"
            exit 1
          }
          # key.properties is gitignored; build.gradle.kts reads it from the root project.
          {
            echo "storeFile=$keydir/release.jks"
            echo "storeType=$store_type"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
          chmod 600 app/android/key.properties

      - name: Build the release APK
        run: |
          set -euo pipefail
          extra=(--no-companion)
          if [[ "${{ inputs.companion }}" == "true" ]]; then extra=(); fi
          args=("${extra[@]}")
          if [[ -n "${{ inputs.build_name }}" ]]; then args+=(--build-name "${{ inputs.build_name }}"); fi
          if [[ -n "${{ inputs.build_number }}" ]]; then args+=(--build-number "${{ inputs.build_number }}"); fi
          # Same retry as the wrapper step: a cold cache can still meet a 429/502.
          for attempt in 1 2 3; do
            if tooling/build-apk.sh "${args[@]}"; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "release build failed (attempt $attempt), retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done

      - name: Name the artifact
        id: name
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          if [[ -n "${{ inputs.build_name }}" ]]; then version="${{ inputs.build_name }}"; fi
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          test -f "$apk"
          cp "$apk" "$RUNNER_TEMP/dsh-go-$version-arm64.apk"
          echo "file=dsh-go-$version-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ runner.temp }}/${{ steps.name.outputs.file }}
          if-no-files-found: error
          retention-days: 30